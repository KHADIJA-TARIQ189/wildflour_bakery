<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9DFC7"/>
      <stop offset="100%" stop-color="#D7C8A6"/>
    </linearGradient>
    <radialGradient id="doughTop" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F7F1E6"/>
      <stop offset="70%" stop-color="#EAD9BC"/>
      <stop offset="100%" stop-color="#C9A876"/>
    </radialGradient>
    <filter id="basketShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2b1a10" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bgB)"/>

  <!-- basket 1 -->
  <g filter="url(#basketShadow)">
    <circle cx="250" cy="330" r="150" fill="#B5852E"/>
    <circle cx="250" cy="330" r="140" fill="url(#doughTop)"/>
  </g>
  <g stroke="#8A6224" stroke-width="1.6" opacity="0.55" fill="none">
    <circle cx="250" cy="330" r="150"/>
    <circle cx="250" cy="330" r="128"/>
  </g>
  <!-- radial wicker spokes -->
  <g stroke="#8A6224" stroke-width="2" opacity="0.4">
    <line x1="250" y1="180" x2="250" y2="480"/>
    <line x1="120" y1="260" x2="380" y2="400"/>
    <line x1="120" y1="400" x2="380" y2="260"/>
    <line x1="140" y1="200" x2="360" y2="460"/>
    <line x1="360" y1="200" x2="140" y2="460"/>
  </g>
  <!-- flour dust on the dough -->
  <g fill="#FCF8EE" opacity="0.75">
    <circle cx="210" cy="290" r="3.5"/><circle cx="290" cy="310" r="3"/><circle cx="240" cy="360" r="4"/>
    <circle cx="180" cy="350" r="2.5"/><circle cx="300" cy="270" r="3"/>
  </g>

  <!-- basket 2 -->
  <g filter="url(#basketShadow)">
    <circle cx="560" cy="500" r="170" fill="#B5852E"/>
    <circle cx="560" cy="500" r="158" fill="url(#doughTop)"/>
  </g>
  <g stroke="#8A6224" stroke-width="1.6" opacity="0.55" fill="none">
    <circle cx="560" cy="500" r="170"/>
    <circle cx="560" cy="500" r="145"/>
  </g>
  <g stroke="#8A6224" stroke-width="2" opacity="0.4">
    <line x1="560" y1="330" x2="560" y2="670"/>
    <line x1="410" y1="420" x2="710" y2="580"/>
    <line x1="410" y1="580" x2="710" y2="420"/>
    <line x1="430" y1="360" x2="690" y2="640"/>
    <line x1="690" y1="360" x2="430" y2="640"/>
  </g>
  <g fill="#FCF8EE" opacity="0.75">
    <circle cx="520" cy="450" r="4"/><circle cx="600" cy="470" r="3"/><circle cx="560" cy="540" r="3.5"/>
    <circle cx="480" cy="520" r="3"/><circle cx="620" cy="540" r="2.5"/>
  </g>

  <!-- basket 3 -->
  <g filter="url(#basketShadow)">
    <circle cx="330" cy="760" r="140" fill="#B5852E"/>
    <circle cx="330" cy="760" r="129" fill="url(#doughTop)"/>
  </g>
  <g stroke="#8A6224" stroke-width="1.6" opacity="0.55" fill="none">
    <circle cx="330" cy="760" r="140"/>
    <circle cx="330" cy="760" r="119"/>
  </g>
  <g stroke="#8A6224" stroke-width="2" opacity="0.4">
    <line x1="330" y1="630" x2="330" y2="890"/>
    <line x1="210" y1="700" x2="450" y2="820"/>
    <line x1="210" y1="820" x2="450" y2="700"/>
  </g>
  <g fill="#FCF8EE" opacity="0.75">
    <circle cx="300" cy="720" r="3.5"/><circle cx="370" cy="740" r="3"/><circle cx="320" cy="800" r="3.5"/>
  </g>

  <!-- ambient bench flour dust -->
  <g fill="#F7F1E6" opacity="0.55">
    <circle cx="120" cy="150" r="2.5"/><circle cx="700" cy="200" r="2"/>
    <circle cx="90" cy="600" r="2.5"/><circle cx="740" cy="700" r="2"/>
    <circle cx="470" cy="130" r="2"/><circle cx="150" cy="900" r="2.5"/>
  </g>
</svg>
