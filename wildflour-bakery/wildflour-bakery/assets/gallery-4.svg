<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A1B30"/>
      <stop offset="55%" stop-color="#34101F"/>
      <stop offset="100%" stop-color="#EFE6D3"/>
    </linearGradient>
    <linearGradient id="counterTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1E8D5"/>
      <stop offset="100%" stop-color="#DED0AE"/>
    </linearGradient>
    <filter id="loafShadow2" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2b1a10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bgE)"/>

  <rect x="0" y="470" width="1200" height="205" fill="url(#counterTop)"/>
  <rect x="0" y="470" width="1200" height="8" fill="#A94A33" opacity="0.7"/>

  <g filter="url(#loafShadow2)">
    <ellipse cx="130" cy="463" rx="70" ry="40" fill="#A94A33"/>
    <ellipse cx="260" cy="468" rx="60" ry="34" fill="#D6A02C"/>
    <ellipse cx="380" cy="460" rx="75" ry="44" fill="#8a3a26"/>
    <ellipse cx="520" cy="468" rx="65" ry="36" fill="#A94A33"/>
    <ellipse cx="650" cy="462" rx="70" ry="40" fill="#D6A02C"/>
    <ellipse cx="780" cy="468" rx="58" ry="32" fill="#8a3a26"/>
    <ellipse cx="900" cy="460" rx="72" ry="42" fill="#A94A33"/>
    <ellipse cx="1030" cy="468" rx="62" ry="35" fill="#D6A02C"/>
  </g>
  <!-- highlight sheen on each loaf -->
  <g fill="#FCE3A8" opacity="0.25">
    <ellipse cx="110" cy="450" rx="22" ry="10"/><ellipse cx="240" cy="456" rx="18" ry="8"/>
    <ellipse cx="360" cy="446" rx="24" ry="11"/><ellipse cx="500" cy="456" rx="18" ry="8"/>
    <ellipse cx="630" cy="450" rx="22" ry="10"/><ellipse cx="760" cy="456" rx="16" ry="7"/>
    <ellipse cx="880" cy="446" rx="22" ry="10"/><ellipse cx="1010" cy="456" rx="18" ry="8"/>
  </g>
  <g stroke="#241611" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="105" y1="448" x2="155" y2="448"/><line x1="240" y1="456" x2="280" y2="456"/>
    <line x1="350" y1="444" x2="410" y2="444"/><line x1="495" y1="454" x2="545" y2="454"/>
    <line x1="620" y1="446" x2="680" y2="446"/><line x1="755" y1="456" x2="805" y2="456"/>
    <line x1="870" y1="444" x2="930" y2="444"/><line x1="1005" y1="454" x2="1055" y2="454"/>
  </g>

  <!-- pendant lights -->
  <g stroke="#E8C878" stroke-width="2" opacity="0.7">
    <line x1="200" y1="0" x2="200" y2="140"/>
    <line x1="600" y1="0" x2="600" y2="110"/>
    <line x1="1000" y1="0" x2="1000" y2="150"/>
  </g>
  <g fill="#D6A02C">
    <circle cx="200" cy="150" r="14"/><circle cx="600" cy="120" r="14"/><circle cx="1000" cy="160" r="14"/>
  </g>
  <g fill="#F2A65A" opacity="0.18">
    <circle cx="200" cy="150" r="70"/><circle cx="600" cy="120" r="70"/><circle cx="1000" cy="160" r="70"/>
  </g>

  <!-- shelving suggestion in background -->
  <g stroke="#E8C878" stroke-width="1.5" opacity="0.2">
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
  </g>
</svg>
